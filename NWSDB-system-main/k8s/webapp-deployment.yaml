apiVersion: apps/v1
kind: Deployment
metadata:
  name: nwsdb-webapp
  namespace: nwsdb
  labels:
    app: nwsdb-webapp
    component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nwsdb-webapp
  template:
    metadata:
      labels:
        app: nwsdb-webapp
        component: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: nwsdb-webapp

      # Image pull secrets for private registry
      imagePullSecrets:
        - name: acr-secret

      # Init container to wait for API to be ready
      initContainers:
        - name: wait-for-api
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -f http://nwsdb-webapi:8080/health; do
                echo "Waiting for API..."
                sleep 5
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      containers:
      - name: webapp
        image: nwsdbacr.azurecr.io/nwsdb-webapp:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: nwsdb-config

        # Additional environment variables from Secrets
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nwsdb-secrets
              key: jwt-secret-key
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"

        # Health checks
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Resource management
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: app-logs
          mountPath: /app/logs

      # Pod security and networking
      securityContext:
        fsGroup: 1000

      # Node affinity - prefer spreading across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - nwsdb-webapp
              topologyKey: kubernetes.io/hostname

      # Tolerations for node taints
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "frontend"
        effect: "NoSchedule"

      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: app-logs
        emptyDir: {}

      # Restart policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
