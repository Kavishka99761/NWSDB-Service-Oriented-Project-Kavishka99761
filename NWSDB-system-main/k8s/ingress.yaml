# Ingress for routing external traffic
# Requires an Ingress Controller (e.g., nginx-ingress, Azure Application Gateway)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nwsdb-ingress
  namespace: nwsdb
  labels:
    app: nwsdb
  annotations:
    # For Azure Application Gateway Ingress Controller
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    appgw.ingress.kubernetes.io/backend-hostname: "nwsdb-webapi"

    # For nginx-ingress controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";

    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx  # Change to 'azure-application-gateway' if using AGIC

  # TLS configuration - uncomment for HTTPS
  # tls:
  # - hosts:
  #     - nwsdb.example.com
  #     - api.nwsdb.example.com
  #   secretName: nwsdb-tls-cert

  rules:
  # WebApp route
  - host: nwsdb.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nwsdb-webapp
            port:
              number: 8080

  # WebApi route
  - host: api.nwsdb.example.com  # Change to your API domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nwsdb-webapi
            port:
              number: 8080

  # Alternative: Single domain with path-based routing
  # - host: nwsdb.example.com
  #   http:
  #     paths:
  #     - path: /api
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: nwsdb-webapi
  #           port:
  #             number: 8080
  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: nwsdb-webapp
  #           port:
  #             number: 8080

---
# NetworkPolicy to restrict traffic between pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nwsdb-network-policy
  namespace: nwsdb
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic within namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: nwsdb
  # Allow ingress controller to reach services
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow inter-pod communication
  - to:
    - namespaceSelector:
        matchLabels:
          name: nwsdb
  # Allow external HTTPS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
